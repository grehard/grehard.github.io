<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Driftboard: infinite whiteboard for system sketches</title>
<meta name="description" content="An infinite whiteboard for diagrams, wireframes and system sketches, with connectors that follow shapes, snapping, undo, and PNG, SVG and JSON export.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f5f0'/%3E%3Crect x='5' y='6' width='11' height='8' fill='none' stroke='%231d1f21' stroke-width='2'/%3E%3Crect x='16' y='19' width='11' height='8' fill='none' stroke='%231d1f21' stroke-width='2'/%3E%3Cpath d='M16 10h5.500v9' fill='none' stroke='%23e8401c' stroke-width='2.500'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/panels.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" aria-label="Driftboard">
      <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="5" width="12" height="9" fill="none" stroke="currentColor" stroke-width="2"/><rect x="16" y="19" width="12" height="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 9.500h6v9.500" fill="none" stroke="var(--accent)" stroke-width="2.500"/></svg>
      <span class="brand-name">Driftboard</span>
    </div>
    <button type="button" id="boards-button" class="board-switch" aria-haspopup="true" aria-expanded="false" aria-controls="boards-menu" title="Switch, rename or add boards">
      <span id="board-name" class="truncate"></span>
      <span data-icon="chevron" data-icon-size="16"></span>
    </button>
    <div class="tb-group">
      <button type="button" class="icon-button" id="undo-button" data-icon="undo" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
      <button type="button" class="icon-button" id="redo-button" data-icon="redo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"></button>
    </div>
    <div class="spacer"></div>
    <div class="zoom-group" role="group" aria-label="Zoom">
      <button type="button" class="icon-button" id="zoom-out" data-icon="minus" data-icon-size="16" aria-label="Zoom out" title="Zoom out (-)"></button>
      <button type="button" id="zoom-label" class="zoom-label" aria-label="Zoom level. Reset to 100 percent" title="Reset to 100% (0)">100%</button>
      <button type="button" class="icon-button" id="zoom-in" data-icon="plus" data-icon-size="16" aria-label="Zoom in" title="Zoom in (+)"></button>
    </div>
    <button type="button" class="icon-button" id="view-button" data-icon="view" aria-label="View options" title="View options" aria-haspopup="true" aria-expanded="false" aria-controls="view-menu"></button>
    <button type="button" class="icon-button desktop-only" id="help-button" data-icon="help" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"></button>
    <button type="button" class="icon-button desktop-only" id="theme-button" aria-label="Switch color theme" title="Switch color theme"></button>
    <button type="button" class="icon-button" id="panel-button" data-icon="panel" aria-label="Style panel" title="Style panel" aria-expanded="true" aria-controls="inspector"></button>
    <button type="button" class="primary-button" id="export-button"><span data-icon="export" data-icon-size="16"></span><span class="export-label">Export</span></button>
  </header>

  <nav id="toolbar" role="toolbar" aria-label="Drawing tools">
    <button type="button" class="tool" data-tool="select" data-icon="select" aria-label="Select" title="Select (V)"></button>
    <button type="button" class="tool" data-tool="hand" data-icon="hand" aria-label="Hand" title="Hand: pan the board (H)"></button>
    <span class="tool-gap" aria-hidden="true"></span>
    <button type="button" class="tool" data-tool="rect" data-icon="rect" aria-label="Rectangle" title="Rectangle (R)"></button>
    <button type="button" class="tool" data-tool="ellipse" data-icon="ellipse" aria-label="Ellipse" title="Ellipse (O)"></button>
    <button type="button" class="tool" data-tool="diamond" data-icon="diamond" aria-label="Diamond" title="Diamond (D)"></button>
    <span class="tool-gap" aria-hidden="true"></span>
    <button type="button" class="tool" data-tool="line" data-icon="line" aria-label="Line" title="Line: drag from a shape to attach (L)"></button>
    <button type="button" class="tool" data-tool="arrow" data-icon="arrow" aria-label="Arrow" title="Arrow: drag from a shape to attach (A)"></button>
    <button type="button" class="tool" data-tool="pen" data-icon="pen" aria-label="Freehand pen" title="Freehand pen (P)"></button>
    <span class="tool-gap" aria-hidden="true"></span>
    <button type="button" class="tool" data-tool="text" data-icon="text" aria-label="Text" title="Text (T)"></button>
    <button type="button" class="tool" data-tool="sticky" data-icon="sticky" aria-label="Sticky note" title="Sticky note (N)"></button>
    <span class="tool-gap" aria-hidden="true"></span>
    <button type="button" class="tool" data-tool="eraser" data-icon="eraser" aria-label="Eraser" title="Eraser: click or drag over shapes (E)"></button>
  </nav>

  <main id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <canvas id="overlay" tabindex="0" role="application" aria-label="Whiteboard canvas. Choose a tool, then press Enter to place a shape. Press question mark for keyboard shortcuts." aria-describedby="live"></canvas>
    <textarea id="text-editor" aria-label="Edit text" spellcheck="false" hidden></textarea>
    <div id="minimap-wrap" class="minimap" hidden>
      <canvas id="minimap" role="img" aria-label="Board overview. Click or drag to move the view."></canvas>
    </div>
    <div id="toasts" aria-live="polite"></div>
  </main>

  <aside id="inspector" aria-label="Style and arrange"></aside>

  <footer id="statusbar">
    <span id="status-cursor" class="mono" title="Cursor position in board units">X 0 Y 0</span>
    <span id="status-selection" class="truncate"></span>
    <span class="spacer"></span>
    <span id="status-save"></span>
    <span id="status-count"></span>
    <span id="status-perf" class="mono" title="Time to paint the last frame, and how many shapes it drew"></span>
  </footer>

  <div id="boards-menu" class="popover boards-menu" hidden></div>
  <div id="view-menu" class="popover view-menu" role="menu" aria-label="View options" hidden></div>
  <div id="modal-root"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <input type="file" id="load-input" accept=".json,application/json" class="sr-only" tabindex="-1" aria-label="Load a Driftboard JSON file">
</div>

<script src="js/core/util.js"></script>
<script src="js/core/icons.js"></script>
<script src="js/core/palette.js"></script>
<script src="js/core/geometry.js"></script>
<script src="js/core/smoothing.js"></script>
<script src="js/core/text.js"></script>
<script src="js/core/connectors.js"></script>
<script src="js/core/spatial.js"></script>
<script src="js/core/camera.js"></script>
<script src="js/core/transforms.js"></script>
<script src="js/core/snapping.js"></script>
<script src="js/model/schema.js"></script>
<script src="js/model/store.js"></script>
<script src="js/model/seed.js"></script>
<script src="js/model/actions.js"></script>
<script src="js/model/boards.js"></script>
<script src="js/render/painter.js"></script>
<script src="js/render/renderer.js"></script>
<script src="js/render/overlay.js"></script>
<script src="js/render/minimap.js"></script>
<script src="js/io/export.js"></script>
<script src="js/tools/handles.js"></script>
<script src="js/tools/gestures-draw.js"></script>
<script src="js/tools/gestures-select.js"></script>
<script src="js/tools/input.js"></script>
<script src="js/tools/keyboard.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/text-editor.js"></script>
<script src="js/ui/inspector-style.js"></script>
<script src="js/ui/inspector.js"></script>
<script src="js/ui/boards-menu.js"></script>
<script src="js/ui/view-menu.js"></script>
<script src="js/ui/export-dialog.js"></script>
<script src="js/ui/help-panel.js"></script>
<script src="js/app.js"></script>
</body>
</html>
